seed: 0
ckpt_path: /data/xk/zyh_dfgo/UniSO/logs/exp1_scene/sim_high_3/seed0/02_fewshot_tail50p/checkpoints/last.ckpt
out_jsonl: /data/xk/zyh_dfgo/DUO/results/comparison1/exp1_scene_v4/shift_sim_high_3/fs50/candidates/uniso.jsonl
callbacks: {}
trainer:
  enable_checkpointing: false
  max_epochs: 10
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  min_epochs: 1
  accelerator: gpu
  devices: 1
  check_val_every_n_epoch: 1
  deterministic: false
data:
  _target_: src.data.omnipred_datamodule.OmnipredDataModule
  task_names: Superconductor-RandomForest-v0
  input_tokenizer:
    _target_: transformers.T5Tokenizer.from_pretrained
    pretrained_model_name_or_path: google-t5/t5-small
  output_tokenizer:
    _target_: src.data.components.tokenizer.P10Tokenizer
  max_length: 324
  concat_metadata: true
  val_ratio: 0.2
  batch_size: 128
  num_workers: 64
  persistent_workers: true
  pin_memory: false
  data_dir: /data/xk/zyh_dfgo/UniSO/data_exp1_sim_high_3
model:
  _target_: src.models.UniSO_T_improved.OmniPredModule
  encoder_model:
    _target_: transformers.T5EncoderModel
    config:
      _target_: transformers.T5Config
      vocab_size: 32128
      num_layers: 6
      d_kv: 32
      d_model: 384
      d_ff: 512
  decoder_model:
    _target_: transformers.models.t5.modeling_t5.T5Stack
    _partial_: true
    config:
      _target_: transformers.T5Config
      num_layers: 6
      d_kv: 32
      d_ff: 512
      is_decoder: true
      use_cache: true
  input_tokenizer: ${data.input_tokenizer}
  output_tokenizer: ${data.output_tokenizer}
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001
    weight_decay: 0.01
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  scheduler:
    _target_: transformers.get_scheduler
    _partial_: true
    name: cosine
    num_warmup_steps: 1000
    num_training_steps: ${trainer.max_epochs}
  non_shuffled_datamodule:
    _target_: src.data.omnipred_datamodule.NonShuffledOmnipredDataModule
    task_names: AntMorphology-Exact-v0,Superconductor-RandomForest-v0,DKittyMorphology-Exact-v0,TFBind8-Exact-v0,TFBind10-Exact-v0,gtopx_data_2_1,gtopx_data_3_1,gtopx_data_4_1,gtopx_data_6_1
    val_ratio: 0.2
    batch_size: 128
    num_workers: 64
    persistent_workers: true
    pin_memory: false
    data_dir: data/
    input_tokenizer:
      _target_: transformers.T5Tokenizer.from_pretrained
      pretrained_model_name_or_path: google-t5/t5-small
      cache_dir: ./
    output_tokenizer:
      _target_: src.data.components.tokenizer.P10Tokenizer
    max_length: 324
  metadata_embedder:
    _target_: transformers.T5EncoderModel.from_pretrained
    pretrained_model_name_or_path: google-t5/t5-small
    cache_dir: ./
  metadata_embedder_output_dim: 512
  compile: true
task:
  _target_: src.tasks.exp1_task.Exp1Task
  task_name: exp1_D_test_sim_high
  data_dir: /data/xk/zyh_dfgo/UniSO/data_exp1_sim_high_3
paths:
  root_dir: ${oc.env:PROJECT_ROOT}
  data_dir: /data/xk/zyh_dfgo/UniSO/data_exp1_sim_high_3
  log_dir: ${paths.root_dir}/logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
extras:
  ignore_warnings: false
  enforce_tags: false
  print_config: false
searcher:
  _target_: src.searcher.ga.GASearcher
  pop_size: 128
  num_solutions: 128
  n_gen: 50
  MAXIMIZE: true
task_name: exp1-search
tags:
- exp1
- comparison
