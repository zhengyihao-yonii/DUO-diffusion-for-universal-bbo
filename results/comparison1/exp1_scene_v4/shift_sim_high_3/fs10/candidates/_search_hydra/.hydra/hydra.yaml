hydra:
  run:
    dir: /data/xk/zyh_dfgo/DUO/results/comparison1/exp1_scene_v4/shift_sim_high_3/fs10/candidates/_search_hydra
  sweep:
    dir: ${paths.log_dir}/${task_name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(purple)sHYDRA%(reset)s] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
      colorlog:
        (): colorlog.ColoredFormatter
        format: '[%(cyan)s%(asctime)s%(reset)s][%(blue)s%(name)s%(reset)s][%(log_color)s%(levelname)s%(reset)s]
          - %(message)s'
        log_colors:
          DEBUG: purple
          INFO: green
          WARNING: yellow
          ERROR: red
          CRITICAL: red
    handlers:
      console:
        class: logging.StreamHandler
        formatter: colorlog
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${task_name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/data/xk/zyh_dfgo/DUO/results/comparison1/exp1_scene_v4/shift_sim_high_3/fs10/candidates/_search_hydra
    - hydra.job.chdir=false
    - hydra.mode=RUN
    task:
    - task=exp1
    - +task_name=exp1-search
    - extras.enforce_tags=false
    - extras.print_config=false
    - +tags=[exp1,comparison]
    - task.task_name=exp1_D_test_sim_high
    - task.data_dir=/data/xk/zyh_dfgo/UniSO/data_exp1_sim_high_3
    - ++data.data_dir=/data/xk/zyh_dfgo/UniSO/data_exp1_sim_high_3
    - ++paths.data_dir=/data/xk/zyh_dfgo/UniSO/data_exp1_sim_high_3
    - ++ckpt_path=/data/xk/zyh_dfgo/UniSO/logs/exp1_scene/sim_high_3/seed0/02_fewshot_tail10p/checkpoints/last.ckpt
    - ++searcher.n_gen=50
    - out_jsonl=/data/xk/zyh_dfgo/DUO/results/comparison1/exp1_scene_v4/shift_sim_high_3/fs10/candidates/uniso.jsonl
    - seed=0
  job:
    name: exp1_search
    chdir: false
    override_dirname: ++ckpt_path=/data/xk/zyh_dfgo/UniSO/logs/exp1_scene/sim_high_3/seed0/02_fewshot_tail10p/checkpoints/last.ckpt,++data.data_dir=/data/xk/zyh_dfgo/UniSO/data_exp1_sim_high_3,++paths.data_dir=/data/xk/zyh_dfgo/UniSO/data_exp1_sim_high_3,++searcher.n_gen=50,+tags=[exp1,comparison],+task_name=exp1-search,extras.enforce_tags=false,extras.print_config=false,out_jsonl=/data/xk/zyh_dfgo/DUO/results/comparison1/exp1_scene_v4/shift_sim_high_3/fs10/candidates/uniso.jsonl,seed=0,task.data_dir=/data/xk/zyh_dfgo/UniSO/data_exp1_sim_high_3,task.task_name=exp1_D_test_sim_high,task=exp1
    id: ???
    num: ???
    config_name: exp1_search.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /data/xk/zyh_dfgo/UniSO
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /data/xk/zyh_dfgo/UniSO/configs
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: /data/xk/zyh_dfgo/DUO/results/comparison1/exp1_scene_v4/shift_sim_high_3/fs10/candidates/_search_hydra
    choices:
      searcher: ga
      hydra: default
      extras: default
      paths: default
      trainer: default
      logger: null
      task: exp1
      model: UniSO-T-Improved
      data: omnipred
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: colorlog
      hydra/hydra_logging: colorlog
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
